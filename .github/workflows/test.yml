name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check maintained sources, generated copies, syntax matrix and catalogue registry
        run: npm run check
      - run: node plugin/scripts/prepublish-check.mjs
        env:
          DSC_QUIET_SKIP_NOTICE: "1"
          DSC_TEST_TAP: prepublish.tap
      - run: node tools/engineering-check.mjs > engineering.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: engineering-node-${{ matrix.node }}
          path: |
            engineering.json
            prepublish.tap
            prepublish.tap.stderr
          retention-days: 7
  linux-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    strategy:
      fail-fast: false
      matrix:
        dsh: ["0.2.0-rc.2", "0.2.1-rc.2", "0.2.1-rc.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned official DSH and pnpm in a private runner prefix
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/dsh-runtime" --no-audit --no-fund @deepseek-ai/dsh@${{ matrix.dsh }} pnpm@11.25.0
          echo "$RUNNER_TEMP/dsh-runtime/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Prepare preinstalled Chrome files before timed protocol acceptance
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome)"
          echo "DSC_CHROME=$chrome_path" >> "$GITHUB_ENV"
          python3 - <<'PY' > linux-chrome-preparation.json
          import hashlib, json, pathlib, re, subprocess, time
          root = pathlib.Path('/opt/google/chrome')
          binary = root / 'chrome'
          if not binary.is_file():
              raise RuntimeError('Expected the official runner Chrome installation')
          # Read the fixed vendor installation and its linked libraries once.
          # This is input preparation, not a Chrome launch or protocol retry.
          started = time.monotonic()
          linked = subprocess.run(['ldd', str(binary)], check=True, text=True, capture_output=True).stdout
          files = {p.resolve() for p in root.rglob('*') if p.is_file()}
          files.update(pathlib.Path(p).resolve() for p in re.findall(r'(/[^\s()]+)', linked))
          if len(files) > 4096 or sum(p.stat().st_size for p in files) > 1024**3:
              raise RuntimeError('Chrome preparation exceeds the file/byte budget')
          rows = []
          for p in sorted(files):
              before = p.stat()
              digest, size, at = hashlib.sha256(), 0, time.monotonic()
              with p.open('rb') as stream:
                  while block := stream.read(1024**2):
                      digest.update(block)
                      size += len(block)
              if size != before.st_size or p.stat().st_mtime_ns != before.st_mtime_ns:
                  raise RuntimeError('Chrome installation changed during preparation')
              rows.append(dict(file=str(p.relative_to(root)) if p.is_relative_to(root) else p.name,
                               bytes=size, sha256=digest.hexdigest(), milliseconds=(time.monotonic()-at)*1000))
          print(json.dumps(dict(complete=True, files=len(rows), bytes=sum(r['bytes'] for r in rows),
                                milliseconds=(time.monotonic()-started)*1000, chromeLaunches=0, rows=rows)))
          PY
          node -e 'const x=require("./linux-chrome-preparation.json");console.log(JSON.stringify({complete:x.complete,files:x.files,bytes:x.bytes,milliseconds:x.milliseconds,chromeLaunches:x.chromeLaunches}))'
      - name: Real Linux Chrome startup and failure evidence
        shell: bash
        env:
          DSC_SLOW: "1"
          DSC_EXECUTION_DIAGNOSTICS: linux-execution-diagnostics
        run: |
          chrome_path="$(command -v google-chrome || command -v chromium)"
          "$chrome_path" --version > linux-chrome-environment.txt
          node -e 'const os=require("node:os"); console.log(JSON.stringify({node:process.versions.node,kernel:os.release(),arch:process.arch,parallelism:os.availableParallelism()}))' >> linux-chrome-environment.txt
          cat linux-chrome-environment.txt
          startup_status=0
          node --test --test-reporter=tap test/debugger.test.mjs test/functional-health.test.mjs > linux-chrome-startup.tap 2>&1 || startup_status=$?
          cat linux-chrome-startup.tap
          exit "$startup_status"
      - name: Real private Linux DSH, loader labels and artifact responsiveness
        shell: bash
        env:
          DSC_SLOW: "1"
          DSC_EXECUTION_DIAGNOSTICS: linux-execution-diagnostics
          DSC_REQUIRE_RC2_UI: "1"
          DSC_ACCEPTANCE_DSH_VERSION: ${{ matrix.dsh }}
          DSC_RC2_LIVE_LOG: linux-rc2.json
          DSC_ENGINEERING_LIVE_LOG: linux-engineering.json
          DSC_BUSINESS_LIVE_DIR: linux-business
          DSC_SIDEBAR_LIVE_DIR: linux-sidebar
          DSC_EDITOR_LIVE_ROOT: linux-editors
        run: |
          test_status=0
          node --test --test-reporter=tap test/probe-boot.test.mjs test/labels.test.mjs test/engineering-live.test.mjs test/profile-lock.test.mjs test/rc2-live.test.mjs test/business-labels.test.mjs > linux-live.tap 2>&1 || test_status=$?
          cat linux-live.tap
          exit "$test_status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-live-evidence-${{ matrix.dsh }}
          retention-days: 7
          path: |
            linux-execution-diagnostics/
            linux-chrome-preparation.json
            linux-live.tap
            linux-chrome-startup.tap
            linux-chrome-environment.txt
            linux-engineering.json
            linux-rc2.json
            linux-business/
            linux-sidebar/
            linux-editors/
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit the frozen workspace and independent plugin runtime graph
        run: npm run security:dependencies
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-security
          path: dependency-security.json
          if-no-files-found: error
          retention-days: 7
